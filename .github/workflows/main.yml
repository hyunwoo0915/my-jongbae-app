name: Jongbae Alarm

on:
  schedule:
    # 한국 오후 3시 12분은 영국 시간으로 아침 6시 12분입니다. (깃허브는 영국 시계를 씁니다)
    # 1-5는 월화수목금 (평일)에만 일하라는 뜻입니다. 주말엔 알바생도 쉽니다!
    - cron: '12 6 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 업무 지시서 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 프로그램 설치하기
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

     - name: 필요한 부품 설치하기
      run: pip install requests pandas beautifulsoup4

    - name: 업무 지시서 실행하기 (비밀 금고 열쇠도 같이 줌)
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python auto_jongbae.py
